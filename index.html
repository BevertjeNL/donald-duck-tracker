<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Donald Duck Tracker</title>
<script>
// De app is verhuisd van GitHub Pages naar Vercel.
if (location.hostname.endsWith('github.io')) location.replace('https://donald-duck-tracker.vercel.app/');
</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101a30">

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DD Tracker">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <h1>&#129414; Donald Duck Tracker</h1>
    <div class="sub" id="authStatus">Bezig met laden&hellip;</div>
  </div>
</div>

<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="brand">&#129414; DD Tracker <span id="appVersion" class="version-badge"></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" data-do="backup" title="Backup bewaren" aria-label="Backup bewaren">&#128190;</button>
      <button class="icon-btn" data-do="quickcheck" title="Snel opzoeken" aria-label="Snel opzoeken">&#128269;</button>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view active">
      <div class="hero">
        <div class="hero-label">Jouw collectie</div>
        <div class="hero-count"><span id="heroTotal">0</span><span class="hero-unit">edities gelezen</span></div>
        <div id="heroLine" class="hero-line"></div>
        <span class="hero-duck" aria-hidden="true">&#129414;</span>
      </div>

      <div class="home-tiles">
        <button class="tile" data-open="dd_weekblad">
          <span class="emoji" aria-hidden="true">&#128218;</span>
          <div class="tile-body">
            <div class="tile-title">Donald Duck Weekblad</div>
            <div class="tile-sub" data-stat="dd_weekblad">Per jaargang, week 1&ndash;52</div>
            <div class="progress"><span data-bar="dd_weekblad"></span></div>
          </div>
          <span class="tile-arrow" aria-hidden="true">&#8594;</span>
        </button>
        <button class="tile" data-open="kd_weekblad">
          <span class="emoji" aria-hidden="true">&#127925;</span>
          <div class="tile-body">
            <div class="tile-title">Katrien Duck Weekblad</div>
            <div class="tile-sub" data-stat="kd_weekblad">Per jaargang, maand 1&ndash;12</div>
            <div class="progress"><span data-bar="kd_weekblad"></span></div>
          </div>
          <span class="tile-arrow" aria-hidden="true">&#8594;</span>
        </button>
        <button class="tile" data-open="pockets">
          <span class="emoji" aria-hidden="true">&#128214;</span>
          <div class="tile-body">
            <div class="tile-title">Pockets</div>
            <div class="tile-sub" data-stat="pockets">Pocket &amp; Dubbel Pocket</div>
            <div class="progress"><span data-bar="pockets"></span></div>
          </div>
          <span class="tile-arrow" aria-hidden="true">&#8594;</span>
        </button>
      </div>

      <div class="home-actions">
        <button class="action-card" data-do="quickcheck">
          <span class="action-icon" aria-hidden="true">&#128269;</span>
          <span class="action-title">Snel opzoeken</span>
          <span class="action-sub">Heb ik deze al?</span>
        </button>
        <button class="action-card" data-do="backup" id="backupCard">
          <span class="action-icon" aria-hidden="true">&#128190;</span>
          <span class="action-title">Backup bewaren</span>
          <span class="action-sub" id="backupInfo">Nog nooit</span>
        </button>
      </div>
    </section>

    <!-- YEAR GRID (DD / KD) -->
    <section id="view-yeargrid" class="view">
      <div class="view-header">
        <button class="back-btn" data-back="view-home">&#8592;</button>
        <h2 id="yeargridTitle">Donald Duck Weekblad</h2>
      </div>
      <div id="yearRow" class="year-row"></div>
      <div class="year-progress">
        <div id="yearProgressText" class="year-progress-text"></div>
        <div class="progress"><span id="yearProgressBar"></span></div>
      </div>
      <div id="heatmap" class="heatmap"></div>

      <div class="add-special-row">
        <button id="btnToggleSpecialForm" class="btn btn-ghost">+ Speciale editie toevoegen aan dit jaar</button>
        <div id="specialForm" class="inline-form hidden">
          <input id="specialLabel" type="text" placeholder="Naam speciale editie (bv. Zomerspecial)">
          <button id="btnAddSpecial" class="btn btn-primary" style="width:auto;">Toevoegen</button>
        </div>
      </div>
    </section>

    <!-- POCKETS -->
    <section id="view-pockets" class="view">
      <div class="view-header">
        <button class="back-btn" data-back="view-home">&#8592;</button>
        <h2>Pockets</h2>
      </div>
      <div class="subtabs">
        <button class="subtab active" data-pockettab="pocket">Pocket</button>
        <button class="subtab" data-pockettab="dubbel_pocket">Dubbel Pocket</button>
      </div>

      <div id="pocketList" class="pocket-list"></div>

      <div class="section-label">Nieuwe toevoegen</div>
      <div class="inline-form">
        <input id="pocketNumber" type="number" min="1" step="1" placeholder="Nummer" style="max-width:100px;">
        <input id="pocketTheme" type="text" placeholder="Thema / titel (optioneel)">
        <button id="btnAddPocket" class="btn btn-primary" style="width:auto;">+ Toevoegen</button>
      </div>
    </section>

    <!-- QUICK CHECK -->
    <section id="view-quickcheck" class="view">
      <div class="view-header">
        <button class="back-btn" data-back="view-home">&#8592;</button>
        <h2>Snel opzoeken</h2>
      </div>
      <form id="qcForm" class="qc-form">
        <select id="qcType">
          <option value="dd_weekblad">Donald Duck Weekblad</option>
          <option value="kd_weekblad">Katrien Duck Weekblad</option>
          <option value="pocket">Pocket</option>
          <option value="dubbel_pocket">Dubbel Pocket</option>
        </select>
        <input id="qcYear" type="number" min="1901" max="9999" step="1" placeholder="Jaargang (bv. 2023)">
        <input id="qcNumber" type="number" min="1" step="1" placeholder="Nummer" required>
        <button type="submit" class="btn btn-primary">Check</button>
      </form>
      <div id="qcResult" class="qc-result hidden"></div>
    </section>
  </main>
</div>

<div id="appStatus" class="app-status hidden" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
